[project]
name = "plovdiv-backend"
version = "0.1.0"
description = "FastAPI backend for Plovdiv weather and air quality warehouse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "duckdb>=1.0.0",
    "jsonschema>=4.0",
]

# Test and development dependencies, kept out of the production install
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
    "anyio[trio]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
