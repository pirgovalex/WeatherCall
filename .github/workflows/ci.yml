name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  warehouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plovdiv-warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plovdiv-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plovdiv-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: plovdiv-frontend/.nvmrc
          cache: npm
          cache-dependency-path: plovdiv-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
