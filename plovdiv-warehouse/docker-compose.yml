services:
  ingest:
    build: .
    image: plovdiv-warehouse
    container_name: plovdiv_ingest
    restart: unless-stopped
    volumes:
      # Code is read-only inside the container
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./models:/app/models:ro
      # Settings are read from /app/.env by the application itself
      - ./.env:/app/.env:ro
      # Landing files, logs and marts persist on the host
      - ./data:/app/data

  dbt:
    image: plovdiv-warehouse
    container_name: plovdiv_dbt
    # Not started by `docker compose up`; run on demand: docker compose run --rm dbt
    profiles: ["manual"]
    working_dir: /app/dbt
    command: ["dbt", "build"]
    environment:
      DBT_PROFILES_DIR: /app/dbt
      # dbt writes its run artifacts outside the read-only project folder
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
    volumes:
      - ./dbt:/app/dbt:ro
      - ./data:/app/data
